aid: poetic
name: Poetic
description: >-
  Poetic is an enterprise AI automation company whose platform learns an
  organization's rules and procedures and then executes end-to-end business
  processes with high precision and compliance. Marketed as "turn your business
  into software," Poetic ingests procedures, training materials, and expert
  feedback to build self-healing automations that adapt when underlying systems
  change, targeting long, multi-step workflows such as fraud detection, KYC, and
  dispute resolution. The company emphasizes enterprise-grade security with zero
  data retention (processing data in-transit only) and states SOC 2 Type II, PCI
  DSS, HIPAA, and GDPR compliance, and cites customers including AIG, SoFi, and
  Chime. Poetic is an early-stage, Kleiner Perkins-backed AI company; as of this
  profile it publishes no public API, developer documentation, or SDKs.
